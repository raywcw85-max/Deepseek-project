<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050a0f" />
  <meta name="description" content="經典貪食蛇遊戲，支援鍵盤、滑動手勢與虛擬方向鍵。" />
  <title>貪食蛇 · Snake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #050a0f;
      --surface: rgba(12, 26, 22, 0.82);
      --line: rgba(125, 255, 178, 0.14);
      --text: #e9f7ef;
      --muted: #8aa79a;
      --accent: #4ade80;
      --accent-soft: #7dffb2;
      --gold: #ffd166;
      --danger: #ff6b81;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      --radius: 22px;
      font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(61, 220, 132, 0.18), transparent 42%),
        radial-gradient(circle at 85% 90%, rgba(255, 209, 102, 0.1), transparent 45%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(125, 255, 178, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 255, 178, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 75%);
      mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 75%);
    }

    .game-shell {
      position: relative;
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      font-size: 26px;
      line-height: 1;
      background: linear-gradient(145deg, rgba(61, 220, 132, 0.22), rgba(61, 220, 132, 0.05));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.12em;
      background: linear-gradient(120deg, #d8ffe8, var(--accent-soft) 45%, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 2px 0 0;
      font-size: 10px;
      letter-spacing: 0.38em;
      color: var(--muted);
    }

    .stats {
      display: flex;
      gap: 10px;
    }

    .stat {
      min-width: 76px;
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    #score { color: var(--accent-soft); }
    #best { color: var(--gold); }
    #length { color: #9ad7ff; }

    .board-wrap {
      position: relative;
      width: min(600px, 100%);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: #071410;
      border: 1px solid var(--line);
      box-shadow: var(--shadow), 0 0 0 6px rgba(61, 220, 132, 0.04);
    }

    .board-wrap.hit {
      animation: shake 0.32s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 45%, rgba(5, 14, 11, 0.55), rgba(3, 8, 7, 0.88));
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay-card {
      width: min(380px, 100%);
      padding: 28px 24px 22px;
      text-align: center;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(20, 46, 36, 0.94), rgba(8, 20, 16, 0.96));
      border: 1px solid rgba(125, 255, 178, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .overlay-kicker {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .overlay h2 {
      margin: 0 0 10px;
      font-size: clamp(24px, 6vw, 34px);
      letter-spacing: 0.08em;
      line-height: 1.3;
    }

    .overlay p {
      margin: 0 auto 18px;
      max-width: 30ch;
      font-size: 14px;
      line-height: 1.75;
      color: var(--muted);
    }

    .overlay .hint {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: #6d8a7c;
    }

    .touch-hint {
      display: none;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      border-radius: 999px;
      padding: 12px 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .btn.primary {
      color: #06251a;
      background: linear-gradient(135deg, #9dffc4, #3ddc84 60%, #22b46a);
      box-shadow: 0 10px 26px rgba(61, 220, 132, 0.28);
    }

    .btn.primary:hover {
      filter: brightness(1.06);
      box-shadow: 0 14px 32px rgba(61, 220, 132, 0.38);
    }

    .btn.primary:focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .keys {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .keys span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-width: 2px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(61, 220, 132, 0.12);
      border-color: rgba(125, 255, 178, 0.3);
    }

    .icon-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-btn[aria-pressed="true"] {
      color: var(--gold);
    }

    .icon {
      font-size: 15px;
      line-height: 1;
    }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
      justify-content: center;
      margin-top: 2px;
    }

    .dpad button {
      appearance: none;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, rgba(23, 48, 39, 0.95), rgba(10, 24, 19, 0.95));
      color: var(--accent-soft);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: background 0.12s ease, transform 0.12s ease;
    }

    .dpad button:active {
      background: rgba(61, 220, 132, 0.22);
      transform: scale(0.95);
    }

    .dpad button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .dpad [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .dpad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .dpad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 720px) {
      .dpad {
        display: grid;
      }

      .keys {
        display: none;
      }

      .desktop-hint {
        display: none;
      }

      .touch-hint {
        display: inline;
      }

      .actions {
        width: 100%;
        margin-left: 0;
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 14px 10px 20px;
        align-items: flex-start;
      }

      .game-shell {
        gap: 14px;
      }

      .logo {
        width: 44px;
        height: 44px;
        font-size: 22px;
        border-radius: 13px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .stats {
        width: 100%;
      }

      .stat {
        flex: 1;
        min-width: 0;
        padding: 7px 6px;
      }

      .stat strong {
        font-size: 18px;
      }

      .overlay-card {
        padding: 22px 18px 18px;
      }

      .overlay p {
        font-size: 13px;
      }

      .keys {
        gap: 8px 12px;
      }

      .keys .desktop-only {
        display: none;
      }

      .actions {
        margin-left: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="hud">
      <div class="brand">
        <span class="logo" aria-hidden="true">🐍</span>
        <div>
          <h1>貪食蛇</h1>
          <p class="tagline">SNAKE</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">分數</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">最高分</span>
          <strong id="best">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">長度</span>
          <strong id="length">3</strong>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="600" height="600" role="img" aria-label="貪食蛇遊戲畫面"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="overlay-kicker" id="overlayKicker">準備好了嗎？</p>
          <h2 id="overlayTitle">貪食蛇</h2>
          <p id="overlayText">移動方向、吃下果實讓身體變長；撞到牆壁或自己就結束了。</p>
          <button class="btn primary" id="overlayButton" type="button">開始遊戲</button>
          <p class="hint">
            <span class="desktop-hint">空白鍵暫停 · Enter 重新開始<br /></span>
            <span class="touch-hint">滑動畫布轉向 · 輕觸畫面暫停<br /></span>
            每吃 5 個果實會出現限時黃金果實 ✨
          </p>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="keys" aria-hidden="true">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移動</span>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span class="desktop-only"><kbd>Space</kbd> 暫停</span>
        <span class="desktop-only"><kbd>M</kbd> 音效</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="muteButton" type="button" aria-pressed="false" aria-label="切換音效">
          <span class="icon" aria-hidden="true">🔊</span><span class="icon-label">音效開啟</span>
        </button>
        <button class="icon-btn" id="restartButton" type="button" aria-label="重新開始">
          <span class="icon" aria-hidden="true">↻</span><span class="icon-label">重新開始</span>
        </button>
      </div>
    </div>

    <div class="dpad" id="dpad" aria-label="虛擬方向鍵">
      <button type="button" data-dir="up" aria-label="向上">▲</button>
      <button type="button" data-dir="left" aria-label="向左">◀</button>
      <button type="button" data-dir="down" aria-label="向下">▼</button>
      <button type="button" data-dir="right" aria-label="向右">▶</button>
    </div>
  </main>
  <script>
    (() => {
      'use strict';

      // ── 常數設定 ────────────────────────────────────────
      const COLS = 20;
      const ROWS = 20;
      const CELL = 30;
      const BOARD_W = COLS * CELL;
      const BOARD_H = ROWS * CELL;
      const BASE_TICK = 150;       // 初始每步毫秒數
      const MIN_TICK = 78;         // 最快速度
      const SPEED_STEP = 4;        // 每吃一個食物減少的毫秒數
      const GOLD_LIFETIME = 7000;  // 黃金果實存活時間 (ms)
      const GOLD_EVERY = 5;        // 每吃幾個食物出現一次黃金果實
      const APPLE_SCORE = 10;
      const GOLD_SCORE = 30;
      const STORAGE_BEST = 'snake.bestScore';
      const STORAGE_MUTED = 'snake.muted';

      // ── DOM 元素 ────────────────────────────────────────
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const lengthEl = document.getElementById('length');
      const overlay = document.getElementById('overlay');
      const overlayKicker = document.getElementById('overlayKicker');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const overlayButton = document.getElementById('overlayButton');
      const muteButton = document.getElementById('muteButton');
      const restartButton = document.getElementById('restartButton');
      const dpad = document.getElementById('dpad');
      const boardWrap = document.querySelector('.board-wrap');

      // ── 遊戲狀態 ────────────────────────────────────────
      // state: 'ready' | 'running' | 'paused' | 'over'
      let snake = [];
      let direction = { x: 1, y: 0 };
      let directionQueue = [];
      let food = null;
      let particles = [];
      let score = 0;
      let eaten = 0;
      let tickMs = BASE_TICK;
      let state = 'ready';
      let accumulator = 0;
      let lastFrame = performance.now();
      let bestAtRunStart = 0;

      // ── 存檔工具（無痕模式可能無法使用 localStorage）─────
      function readStored(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw === null ? fallback : raw;
        } catch (error) {
          return fallback;
        }
      }

      function writeStored(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          /* 忽略寫入失敗，不影響遊戲進行 */
        }
      }

      let best = Math.max(0, Number(readStored(STORAGE_BEST, 0)) || 0);
      let muted = readStored(STORAGE_MUTED, '0') === '1';

      // ── 畫布尺寸（支援高解析度螢幕）─────────────────────
      function setupCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.round(BOARD_W * dpr);
        canvas.height = Math.round(BOARD_H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      setupCanvas();

      // ── 音效（WebAudio 即時合成，無需外部檔案）───────────
      let audioCtx = null;

      function ensureAudio() {
        if (!audioCtx) {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return null;
          audioCtx = new AudioCtor();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playTone(freq, duration = 0.09, type = 'triangle', volume = 0.05, delay = 0) {
        if (muted) return;
        const ac = ensureAudio();
        if (!ac) return;
        const start = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(volume, start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      }

      function updateMuteButton() {
        muteButton.setAttribute('aria-pressed', String(muted));
        muteButton.querySelector('.icon').textContent = muted ? '🔇' : '🔊';
        muteButton.querySelector('.icon-label').textContent = muted ? '音效關閉' : '音效開啟';
      }

      function toggleMute() {
        muted = !muted;
        writeStored(STORAGE_MUTED, muted ? '1' : '0');
        updateMuteButton();
        if (!muted) playTone(660, 0.08, 'sine', 0.05);
      }

      // ── 遊戲流程 ────────────────────────────────────────
      function newGame() {
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        directionQueue = [];
        particles = [];
        score = 0;
        eaten = 0;
        tickMs = BASE_TICK;
        accumulator = 0;
        state = 'ready';
        bestAtRunStart = best;
        boardWrap.classList.remove('hit');
        spawnFood('apple');
        updateHud();
      }

      function startGame() {
        newGame();
        state = 'running';
        lastFrame = performance.now();
        accumulator = 0;
        hideOverlay();
        ensureAudio();
        playTone(440, 0.07, 'triangle', 0.05);
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'running';
        lastFrame = performance.now();
        accumulator = 0;
        hideOverlay();
        ensureAudio();
      }

      function togglePause() {
        if (state === 'running') {
          state = 'paused';
          showOverlay('暫時休息', '已暫停', '按空白鍵或點擊按鈕繼續遊戲。', '繼續遊戲');
          playTone(280, 0.08, 'sine', 0.04);
        } else if (state === 'paused') {
          resumeGame();
        }
      }

      // ── 食物生成 ────────────────────────────────────────
      function spawnFood(kind) {
        const occupied = new Set(snake.map((segment) => `${segment.x},${segment.y}`));
        const free = [];
        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 0; x < COLS; x += 1) {
            if (!occupied.has(`${x},${y}`)) free.push({ x, y });
          }
        }
        if (free.length === 0) {
          food = null;
          endGame('棋盤已被你填滿，完美通關！', true);
          return;
        }
        const cell = free[Math.floor(Math.random() * free.length)];
        const nextKind = kind || (eaten > 0 && eaten % GOLD_EVERY === 0 ? 'gold' : 'apple');
        food = { x: cell.x, y: cell.y, kind: nextKind, spawnedAt: performance.now() };
      }

      // ── HUD 與覆蓋層 ────────────────────────────────────
      function updateHud() {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
        lengthEl.textContent = String(snake.length);
      }

      function showOverlay(kicker, title, text, buttonLabel) {
        overlayKicker.textContent = kicker;
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlayButton.textContent = buttonLabel;
        overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        overlay.classList.add('hidden');
      }

      // ── 每一步的移動與判定 ──────────────────────────────
      function step() {
        if (state !== 'running') return;
        if (directionQueue.length > 0) {
          direction = directionQueue.shift();
        }

        const head = snake[0];
        const next = { x: head.x + direction.x, y: head.y + direction.y };

        // 撞牆
        if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) {
          endGame('撞到牆壁了！');
          return;
        }

        const willEat = food !== null && next.x === food.x && next.y === food.y;
        // 沒吃到食物時尾巴會移開，所以不必檢查最後一節
        const body = willEat ? snake : snake.slice(0, -1);
        if (body.some((segment) => segment.x === next.x && segment.y === next.y)) {
          endGame('咬到自己的身體了！');
          return;
        }

        snake.unshift(next);

        if (willEat) {
          const isGold = food.kind === 'gold';
          score += isGold ? GOLD_SCORE : APPLE_SCORE;
          eaten += 1;
          tickMs = Math.max(MIN_TICK, BASE_TICK - eaten * SPEED_STEP);
          burst(next.x, next.y, isGold ? '#ffd166' : '#ff6b81');
          playTone(isGold ? 880 : 620, 0.08, 'triangle', 0.05);
          if (isGold) {
            playTone(1180, 0.1, 'sine', 0.04, 0.07);
          }

          if (score > best) {
            best = score;
            writeStored(STORAGE_BEST, String(best));
          }

          food = null;
          if (snake.length >= COLS * ROWS) {
            updateHud();
            endGame('棋盤已被你填滿，完美通關！', true);
            return;
          }

          spawnFood();
          updateHud();
        } else {
          snake.pop();
        }
      }

      // ── 遊戲結束／通關 ──────────────────────────────────
      function endGame(message, isWin = false) {
        if (state === 'over') return;
        state = 'over';

        const isNewBest = score > bestAtRunStart;
        if (score > best) {
          best = score;
          writeStored(STORAGE_BEST, String(best));
        }
        updateHud();

        if (isWin) {
          playTone(660, 0.12, 'sine', 0.05);
          playTone(880, 0.14, 'sine', 0.05, 0.1);
          playTone(1320, 0.18, 'sine', 0.05, 0.22);
        } else {
          playTone(220, 0.14, 'sawtooth', 0.04);
          playTone(150, 0.22, 'sawtooth', 0.04, 0.12);
          boardWrap.classList.remove('hit');
          void boardWrap.offsetWidth; // 強制重排以重新觸發動畫
          boardWrap.classList.add('hit');
        }

        const title = isWin ? '你贏了！' : message;
        const text = isNewBest
          ? `本局得分 ${score} 分 · 刷新最高分！`
          : `本局得分 ${score} 分 · 最高分 ${best} 分`;
        showOverlay(isWin ? '完美通關' : '遊戲結束', title, text, '再玩一次');
      }

      // ── 輸入控制 ────────────────────────────────────────
      const KEY_DIRECTIONS = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 },
      };

      const DPAD_DIRECTIONS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 },
      };

      function queueDirection(next) {
        if (state === 'ready') {
          startGame();
        }
        if (state !== 'running') return;

        // 以「最後一個排隊中的方向」判斷，避免快速連按造成 180 度反轉
        const last = directionQueue.length > 0 ? directionQueue[directionQueue.length - 1] : direction;
        if (last.x === next.x && last.y === next.y) return;
        if (last.x === -next.x && last.y === -next.y) return;
        if (directionQueue.length < 2) {
          directionQueue.push(next);
        }
      }

      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;

        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        const nextDirection = KEY_DIRECTIONS[key];

        // 忽略長按自動重複，避免空白鍵連續切換暫停狀態
        if (event.repeat) {
          if (nextDirection || key === ' ' || key === 'Enter' || key === 'r' || key === 'm') {
            event.preventDefault();
          }
          return;
        }

        if (nextDirection) {
          event.preventDefault();
          queueDirection(nextDirection);
          return;
        }

        if (key === ' ') {
          event.preventDefault();
          if (state === 'ready') {
            startGame();
          } else if (state === 'running' || state === 'paused') {
            togglePause();
          }
          return;
        }

        if (key === 'Enter') {
          event.preventDefault();
          if (state === 'ready' || state === 'over') {
            startGame();
          } else if (state === 'paused') {
            resumeGame();
          }
          return;
        }

        if (key === 'r') {
          event.preventDefault();
          startGame();
          return;
        }

        if (key === 'm') {
          event.preventDefault();
          toggleMute();
        }
      });

      overlayButton.addEventListener('click', () => {
        if (state === 'paused') {
          resumeGame();
        } else {
          startGame();
        }
      });

      muteButton.addEventListener('click', toggleMute);
      restartButton.addEventListener('click', startGame);

      // 虛擬方向鍵（pointerdown 反應較靈敏，且支援觸控）
      dpad.addEventListener('pointerdown', (event) => {
        const button = event.target.closest('button[data-dir]');
        if (!button) return;
        event.preventDefault();
        queueDirection(DPAD_DIRECTIONS[button.dataset.dir]);
      });

      // 在畫布上滑動轉向，輕觸可開始／暫停
      let touchStart = null;

      canvas.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) return;
        touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      }, { passive: true });

      canvas.addEventListener('touchmove', (event) => {
        if (touchStart) event.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchend', (event) => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;

        if (Math.hypot(dx, dy) < 24) {
          if (state === 'ready') {
            startGame();
          } else if (state === 'running') {
            togglePause();
          }
          return;
        }

        if (Math.abs(dx) > Math.abs(dy)) {
          queueDirection({ x: Math.sign(dx), y: 0 });
        } else {
          queueDirection({ x: 0, y: Math.sign(dy) });
        }
      }, { passive: true });

      // 切到其他頁籤或視窗失焦時自動暫停
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'running') togglePause();
      });

      window.addEventListener('blur', () => {
        if (state === 'running') togglePause();
      });

      window.addEventListener('resize', () => {
        setupCanvas();
        render(performance.now());
      });

      // ── 繪圖工具 ────────────────────────────────────────
      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function mixColor(from, to, ratio) {
        const a = parseInt(from.slice(1), 16);
        const b = parseInt(to.slice(1), 16);
        const t = Math.max(0, Math.min(1, ratio));
        const r = Math.round(((a >> 16) & 255) + ((((b >> 16) & 255) - ((a >> 16) & 255)) * t));
        const g = Math.round(((a >> 8) & 255) + ((((b >> 8) & 255) - ((a >> 8) & 255)) * t));
        const bl = Math.round((a & 255) + (((b & 255) - (a & 255)) * t));
        return `rgb(${r}, ${g}, ${bl})`;
      }

      function drawBackground() {
        const backdrop = ctx.createLinearGradient(0, 0, BOARD_W, BOARD_H);
        backdrop.addColorStop(0, '#081b15');
        backdrop.addColorStop(0.55, '#06130f');
        backdrop.addColorStop(1, '#04100c');
        ctx.fillStyle = backdrop;
        ctx.fillRect(0, 0, BOARD_W, BOARD_H);

        // 棋盤格線
        ctx.strokeStyle = 'rgba(125, 255, 178, 0.055)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 1; x < COLS; x += 1) {
          ctx.moveTo(x * CELL + 0.5, 0);
          ctx.lineTo(x * CELL + 0.5, BOARD_H);
        }
        for (let y = 1; y < ROWS; y += 1) {
          ctx.moveTo(0, y * CELL + 0.5);
          ctx.lineTo(BOARD_W, y * CELL + 0.5);
        }
        ctx.stroke();

        // 中央柔光
        const glow = ctx.createRadialGradient(
          BOARD_W / 2, BOARD_H / 2, 0,
          BOARD_W / 2, BOARD_H / 2, BOARD_W * 0.7
        );
        glow.addColorStop(0, 'rgba(61, 220, 132, 0.07)');
        glow.addColorStop(1, 'rgba(61, 220, 132, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, BOARD_W, BOARD_H);
      }

      function drawFood(now) {
        if (!food) return;

        const cx = food.x * CELL + CELL / 2;
        const cy = food.y * CELL + CELL / 2;
        const isGold = food.kind === 'gold';
        const main = isGold ? '#ffd166' : '#ff5f7e';
        const light = isGold ? '#fff3c4' : '#ffb3c1';
        const radius = CELL * (isGold ? 0.33 : 0.3) + Math.sin(now / 180) * 1.4;

        ctx.save();
        ctx.shadowColor = main;
        ctx.shadowBlur = isGold ? 26 : 18;
        const globe = ctx.createRadialGradient(
          cx - radius * 0.35, cy - radius * 0.35, radius * 0.15,
          cx, cy, radius
        );
        globe.addColorStop(0, light);
        globe.addColorStop(1, main);
        ctx.fillStyle = globe;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 葉子
        ctx.fillStyle = isGold ? '#b7861b' : '#4ade80';
        ctx.beginPath();
        ctx.ellipse(
          cx + radius * 0.3, cy - radius - 2,
          radius * 0.46, radius * 0.22,
          -Math.PI / 5, 0, Math.PI * 2
        );
        ctx.fill();

        // 黃金果實的倒數圓環
        if (isGold) {
          const remain = Math.max(0, 1 - (now - food.spawnedAt) / GOLD_LIFETIME);
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(255, 243, 196, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.arc(cx, cy, CELL * 0.44, -Math.PI / 2, -Math.PI / 2 + remain * Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawSnake() {
        for (let i = snake.length - 1; i >= 0; i -= 1) {
          const segment = snake[i];
          const ratio = snake.length === 1 ? 0 : i / (snake.length - 1);
          const x = segment.x * CELL;
          const y = segment.y * CELL;
          const isHead = i === 0;
          const inset = isHead ? 1.6 : 3.2;
          const size = CELL - inset * 2;

          ctx.save();
          if (isHead) {
            ctx.shadowColor = 'rgba(125, 255, 178, 0.85)';
            ctx.shadowBlur = 16;
          }

          const bodyGradient = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
          bodyGradient.addColorStop(0, mixColor('#b9ffd6', '#13855a', ratio));
          bodyGradient.addColorStop(1, mixColor('#48e68f', '#0a5c3e', ratio));
          ctx.fillStyle = bodyGradient;
          roundedRect(x + inset, y + inset, size, size, isHead ? 10 : 8);
          ctx.fill();

          if (isHead) {
            ctx.strokeStyle = 'rgba(235, 255, 243, 0.7)';
            ctx.lineWidth = 1.2;
            roundedRect(x + inset, y + inset, size, size, 10);
            ctx.stroke();
          }
          ctx.restore();
        }
        drawEyes();
      }

      function drawEyes() {
        const head = snake[0];
        if (!head) return;

        const cx = head.x * CELL + CELL / 2;
        const cy = head.y * CELL + CELL / 2;
        const forwardX = direction.x;
        const forwardY = direction.y;
        const sideX = -forwardY;
        const sideY = forwardX;

        for (const sign of [-1, 1]) {
          const ex = cx + forwardX * 6 + sideX * 6 * sign;
          const ey = cy + forwardY * 6 + sideY * 6 * sign;

          ctx.fillStyle = '#052016';
          ctx.beginPath();
          ctx.arc(ex, ey, 3.1, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.beginPath();
          ctx.arc(ex + 1.1, ey - 1.1, 1.05, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ── 粒子特效 ────────────────────────────────────────
      function burst(cellX, cellY, color) {
        const cx = cellX * CELL + CELL / 2;
        const cy = cellY * CELL + CELL / 2;

        for (let i = 0; i < 14; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.8 + Math.random() * 3.2; // 每幀像素
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: 1.5 + Math.random() * 3,
            color,
          });
        }

        if (particles.length > 240) {
          particles.splice(0, particles.length - 240);
        }
      }

      function updateParticles(dt) {
        const frameScale = dt / 16.667;
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.x += particle.vx * frameScale;
          particle.y += particle.vy * frameScale;
          particle.vx *= 0.99;
          particle.vy *= 0.99;
          particle.life -= dt / 650;
          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function drawParticles() {
        ctx.save();
        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life) * 0.9;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, Math.max(0.4, particle.size * particle.life), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function render(now) {
        ctx.clearRect(0, 0, BOARD_W, BOARD_H);
        drawBackground();
        drawFood(now);
        drawSnake();
        drawParticles();
      }

      // ── 主迴圈（固定步長 + 畫面更新）─────────────────────
      function frame(now) {
        const dt = Math.min(now - lastFrame, 250);
        lastFrame = now;

        if (state === 'running') {
          accumulator += dt;
          let steps = 0;

          // 一次最多補 8 步，避免分頁回來時瞬間暴衝
          while (accumulator >= tickMs && state === 'running' && steps < 8) {
            accumulator -= tickMs;
            step();
            steps += 1;
          }
          if (accumulator > tickMs * 4) accumulator = 0;

          // 黃金果實過期後變回普通蘋果
          if (state === 'running' && food && food.kind === 'gold'
            && now - food.spawnedAt > GOLD_LIFETIME) {
            spawnFood('apple');
          }
        }

        updateParticles(dt);
        render(now);
        requestAnimationFrame(frame);
      }

      // ── 初始化 ──────────────────────────────────────────
      newGame();
      updateMuteButton();
      showOverlay('準備好了嗎？', '貪食蛇', '移動方向、吃下果實讓身體變長；撞到牆壁或自己就結束了。', '開始遊戲');
      render(performance.now());
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
